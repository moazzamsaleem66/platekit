// platekit-android: the Android-facing half of platekit. Depends on platekit-core for
// all the country/validation logic; owns only Views + self-contained resources (colors,
// drawables, strings) so it never has to reference the host app's resources — a library
// module can't see the resources of the app that depends on it.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.developer.platekit.android'
    compileSdk 34

    defaultConfig {
        minSdk 28
        targetSdk 33
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':platekit-core')
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
