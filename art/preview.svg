<!-- REFINED HIGHLIGHT ANIMATION -->
<rect class="highlight" x="0" y="0" width="380" height="210" rx="18" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate"
        values="50,190; 440,190; 850,190;
                50,555; 410,555; 1070,555;
                50,895; 410,895; 770,895; 1130,895;
                50,1205; 410,1205; 770,1205;
                50,1550; 470,1550; 890,1550"
        keyTimes="0;0.06;0.12;
                  0.18;0.24;0.30;
                  0.36;0.42;0.48;0.54;
                  0.60;0.66;0.72;
                  0.78;0.84;1"
        dur="25s" repeatCount="indefinite" />
