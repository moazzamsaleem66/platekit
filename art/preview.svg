<svg viewBox="0 0 1600 1800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PlateKit — High-Fidelity Showcase</title>
<defs>
    <style>
        text { font-family: -apple-system, Helvetica, Arial, sans-serif; }
        .bgc { fill: #12141a; }
        .ttl { fill: #f2f4f7; font-size: 40px; font-weight: 900; }
        .sec-ttl { fill: #9aa4b2; font-size: 28px; font-weight: 700; }
        .cap { fill: #6b7280; font-size: 18px; font-weight: 600; text-anchor: middle; }
        .highlight { fill: none; stroke: #2f6fed; stroke-width: 6; stroke-dasharray: 12 8; filter: drop-shadow(0 0 12px #2f6fed); }
    </style>
</defs>
<rect class="bgc" width="1600" height="1800" rx="24"/>

<!-- Header -->
